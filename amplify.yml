version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22
        # npm ci is currently blocked by Amplify's bundled dependency metadata
        # (aws-amplify/amplify-backend#3158). npm install honors the lockfile.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
